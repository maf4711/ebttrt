name: prove

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest
        run: python3 -m unittest discover -s tests -q
      - name: versions match
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.0"
          python3 -c "import json; assert json.load(open('plugin.json'))['version']=='1.0.0'"
